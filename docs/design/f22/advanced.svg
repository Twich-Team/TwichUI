<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">F22 advanced editor</title><desc id="desc">Concept wireframe, not a screenshot. Editor with synthetic preview, direct manipulation and animation states.</desc><defs><linearGradient id="leather" x2="0" y2="1"><stop stop-color="#493326"/><stop offset="1" stop-color="#261c18"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#b9955e"/><stop offset="1" stop-color="#705031"/></linearGradient></defs><rect width="1200" height="760" fill="#171412"/><rect x="20" y="20" width="1160" height="720" rx="12" fill="url(#leather)" stroke="#9e8056" stroke-width="3"/><path d="M20 92H1180 M20 690H1180" stroke="#8b6a45"/><text x="50" y="59" class="brand">TWICHUI  /  SETTINGS</text><text x="1150" y="59" text-anchor="end" class="note">DESIGN WIREFRAME · NOT A SCREENSHOT</text><style>text{font-family:Arial,sans-serif;fill:#e9dec8} .brand{font-size:16px;letter-spacing:2px;fill:#cbb28a} .title{font: bold 25px Georgia,serif;fill:#f3e8d1} .head{font:bold 17px Georgia,serif;fill:#e8d1a8} .label{font-size:15px} .small{font-size:13px;fill:#c9b99f} .note{font-size:11px;letter-spacing:1px;fill:#cdb891} .muted{fill:#a89780;font-size:13px} .card{fill:#38271f;stroke:#806142} .well{fill:#1e1917;stroke:#73583d} .input{fill:#211a17;stroke:#806749} .btn{fill:#493226;stroke:#98734c} .selected{fill:#6a4a30;stroke:#d0ac70;stroke-width:2} .gold{fill:url(#gold);stroke:#d1ae76} .green{fill:#526b52} .purple{fill:#9a79b5} .line{stroke:#ab8a5f;stroke-width:1} </style><text x="50" y="132" class="title">Edit indicator</text><text x="50" y="157" class="small">Healer’s mark  /  Unsaved draft</text><rect x="50" y="178" width="90" height="32" rx="6" class="btn"/><text x="62" y="199" class="small">Simple</text><rect x="148" y="178" width="100" height="32" rx="6" class="selected"/><text x="160" y="199" class="small">Advanced</text><rect x="452" y="178"