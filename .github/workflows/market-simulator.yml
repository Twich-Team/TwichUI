name: Market simulator verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'TwichUI_Workshop/**'
      - 'tests/test_workshop_market_containers.lua'
      - 'tools/simlab/scenarios/workshop.lua'
      - 'tools/simlab/scenarios/reminders.lua'
      - 'tests/test_workshop_advisor.lua'
      - 'tests/test_reminder_gallery.lua'
      - '.github/workflows/market-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-cloud:
    # This owner-authorized release checkpoint does not add a full simulator
    # campaign to ordinary Workshop PRs. Future certifications use dispatch.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/market-containers-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Advance to full only after focused regression receipts pass.
      REGRESSION_PHASE: focused
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the documented software Vulkan runtime on this disposable VM
        shell: bash
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers
          dpkg-query -W libvulkan1 mesa-vulkan-drivers
      - name: Prepare user-owned offline Lua and sandbox dependencies
        shell: bash
        run: |
          deps="$RUNNER_TEMP/market-simulator-deps"
          mkdir -p "$deps/downloads" "$deps/root" "$deps/bin"
          cd "$deps/downloads"
          apt-get download lua5.1 lua-bitop liblua5.1-0 bubblewrap rsync
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$deps/root"; done
          ln -s "$deps/root/usr/bin/bwrap" "$deps/bin/bwrap"
          ln -s "$deps/root/usr/bin/rsync" "$deps/bin/rsync"
          ln -s "$deps/root/usr/bin/luac5.1" "$deps/bin/luac5.1"
          python3 - "$deps" <<'PY'
          import pathlib, shlex, sys
          d=pathlib.Path(sys.argv[1]); root=d/'root'
          module=next(root.glob('usr/lib/*/lua/5.1/bit.so'))
          for name in ('lua5.1','lua'):
              script=d/'bin'/name
              script.write_text('#!/bin/sh\nexec '+shlex.quote(str(root/'usr/bin/lua5.1'))+
                  ' -e '+shlex.quote('package.cpath='+repr(str(module.parent/'?.so'))+'..";"..package.cpath')+' "$@"\n')
              script.chmod(0o755)
          PY
          echo "$deps/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$deps/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Authorize only the pinned-job Bubblewrap executable on this disposable VM
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          sandbox="$RUNNER_TEMP/market-simulator-deps/root/usr/bin/bwrap"
          test -x "$sandbox"
          policy="$RUNNER_TEMP/twichui-market-simulator-bwrap.apparmor"
          cat > "$policy" <<POLICY
          abi <abi/4.0>,
          include <tunables/global>
          profile twichui-market-simulator-bwrap "$sandbox" flags=(unconfined) {
            userns,
          }
          POLICY
          # Owner-authorized executable-specific policy in this disposable VM.
          # Keep the global namespace restriction enabled; never change sysctls.
          sudo -n /usr/sbin/apparmor_parser -r "$policy"
          sudo -n install -d -m 0755 /mnt/c
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          getconf GNU_LIBC_VERSION
          sha256sum "$sandbox"
          "$sandbox" --version
      - name: Prepare the pinned, unmodified simulator and UI reference
        shell: bash
        run: |
          reference="$RUNNER_TEMP/market-simulator-ui"
          git init "$reference"
          git -C "$reference" remote add origin https://github.com/Gethe/wow-ui-source.git
          git -C "$reference" fetch --depth 1 origin ca8368f2f2380cbe696854f7f2646387c278a61b
          export SIMLAB_UI_SOURCE="$reference"
          export WOWSIM_LAB="$RUNNER_TEMP/market-simulator-install"
          bash tools/simlab/setup.sh
          echo "WOWSIM_INSTALL=$WOWSIM_LAB" >> "$GITHUB_ENV"
          echo "WOWSIM_LAB=$WOWSIM_LAB" >> "$GITHUB_ENV"
      - name: Verify focused offline contracts, catalogs and original wrong control
        if: env.REGRESSION_PHASE == 'focused'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run.sh development reminders --jobs 2 --measure
          bash tests/run.sh development workshop-settings --jobs 2 --measure
          bash tests/run.sh development item-advisor --jobs 2 --measure
          bash tests/run.sh development market-performance --jobs 2 --measure
          SIMLAB_ASSETS=0 bash tools/simlab/run.sh reminders
          SIMLAB_ASSETS=0 SIMLAB_ONLY="craft design advisor advisorsmall advisorempty advisorscaled advisorsource advisorcategory advisorscroll advisortentative advisorbags advisorfiltered wrong" bash tools/simlab/run.sh workshop
      - name: Run unchanged full discovery, simulator catalogs and negative controls
        if: env.REGRESSION_PHASE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/simlab/sim.sh --help
          SIMLAB_ASSETS=0 bash tools/simlab/run.sh smoke
          bash tests/run.sh full --profile cloud --jobs 2 --sim-jobs 1 --measure
      - name: Remove the job-specific policy from this disposable VM
        if: always()
        shell: bash
        run: |
          policy="$RUNNER_TEMP/twichui-market-simulator-bwrap.apparmor"
          if [ -f "$policy" ]; then sudo -n /usr/sbin/apparmor_parser -R "$policy"; fi
      - name: Preserve passing and failed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-full-cloud-${{ github.sha }}-${{ github.run_attempt }}
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
