name: Fast Market pricing regressions
on:
  pull_request:
    paths:
      - 'TwichUI_Workshop/**'
      - 'TwichUI_Diagnostics/**'
      - '!!!TwichUI/Core.lua'
      - 'tests/**'
      - 'tools/test_runner.py'
      - 'tools/experiments/**'
      - '.github/workflows/market-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 and bitop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-bitop
      - name: Existing fast Market group (no simulator or large benchmark)
        run: ./tests/run.sh development market-performance --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-performance-fast-report
          path: test-output/verification/
          if-no-files-found: error
