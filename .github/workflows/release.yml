name: Verify and build internally

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Deliberately no publish job, environment secrets, tag trigger or contents-write token.
# Public promotion is pending owner settings and a separately reviewed workflow.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-bitop
      - name: Verification independent of publication policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -I tools/ci_verify.py --base "$BASE"

  internal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan internal build using committed training data
        run: |
          python3 -I tools/release.py internal --out "$RUNNER_TEMP/candidate"
          python3 -I tools/release.py stamp --meta "$RUNNER_TEMP/candidate/meta.json"
          version=$(jq -r .version "$RUNNER_TEMP/candidate/meta.json")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Remove only local tags on the internal build commit
        run: git tag --points-at HEAD | while IFS= read -r tag; do git tag -d -- "$tag"; done
      - name: Package (build only)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d -n "!!!TwichUI-v${{ env.VERSION }}-forever"
          pandoc: false
      - name: Verify and freeze candidate
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          test "${#zips[@]}" -eq 1
          python3 -I tools/release.py seal --meta "$RUNNER_TEMP/candidate/meta.json" \
            --zip "${zips[0]}" --notes "$RUNNER_TEMP/candidate/notes.md"
          cp -- "${zips[0]}" "$RUNNER_TEMP/candidate/"
          cat "$RUNNER_TEMP/candidate/meta.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
