name: Verify and build internally

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Deliberately no publish job, environment secrets, tag trigger or contents-write token.
# Public promotion is isolated in release-promotion.yml behind environment review and the hold.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse new tracked test outputs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            added=$(git diff --no-renames --name-only --diff-filter=A "$BASE" HEAD -- test-output/)
            if [ -n "$added" ]; then
              echo "Generated evidence belongs in artifacts; retain selected permanent evidence under docs/evidence/."
              printf '%s\n' "$added"
              exit 1
            fi
          else
            echo "No comparable base; tracked-output addition check unavailable."
          fi
      - name: Install offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-bitop python3-pil python3-numpy python3-scipy
          /usr/bin/python3 -I -c 'from PIL import Image; import numpy; from scipy import ndimage; print("Map lab image dependencies available")'
      - name: Verification independent of publication policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: PATH="/usr/bin:$PATH" python3 -I tools/ci_verify.py --base "$BASE"
      - name: Collect verification diagnostics
        if: ${{ always() }}
        run: python3 -I tools/collect_verification_evidence.py --out "$RUNNER_TEMP/verification-evidence"
      - name: Retain bounded verification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-evidence/
          if-no-files-found: warn
          overwrite: false
          retention-days: 14

  internal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan internal build using committed training data
        run: |
          python3 -I tools/release.py internal --out "$RUNNER_TEMP/candidate"
          python3 -I tools/release.py stamp --meta "$RUNNER_TEMP/candidate/meta.json"
          version=$(jq -r .version "$RUNNER_TEMP/candidate/meta.json")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Remove only local tags on the internal build commit
        run: git tag --points-at HEAD | while IFS= read -r tag; do git tag -d -- "$tag"; done
      - name: Package (build only)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d -n "!!!TwichUI-v${{ env.VERSION }}-forever"
          pandoc: false
      - name: Verify and freeze candidate
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          test "${#zips[@]}" -eq 1
          python3 -I tools/release.py seal --meta "$RUNNER_TEMP/candidate/meta.json" \
            --zip "${zips[0]}" --notes "$RUNNER_TEMP/candidate/notes.md"
          cp -- "${zips[0]}" "$RUNNER_TEMP/candidate/"
          cat "$RUNNER_TEMP/candidate/meta.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
